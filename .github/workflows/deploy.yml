# Manual deploy, for when the site changes without a digest run — a copy fix, a
# source-list edit, a layout change.
#
# INACTIVE BY DESIGN: workflow_dispatch only. Enabling GitHub Pages, pointing
# DNS, and running this for the first time are Ming's calls.

name: Deploy to GitHub Pages

on:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
